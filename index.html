<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PinGrab - Descarga Pinterest</title>
<style>
:root{--bg:#0f0f13;--card:#1a1a22;--card2:#22222c;--red:#e60023;--text:#f5f5f7;--muted:#9a9aa8;--border:#2c2c38;--green:#22c55e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,sans-serif;min-height:100vh;display:flex;flex-direction:column}header{padding:18px 24px;border-bottom:1px solid var(--border);font-size:21px;font-weight:800}.logo span{color:var(--red)}main{width:100%;max-width:780px;margin:0 auto;padding:55px 18px;flex:1}.hero{text-align:center}.hero h1{font-size:clamp(28px,5vw,42px);line-height:1.15}.hero h1 span{color:var(--red)}.hero p{color:var(--muted);margin-bottom:28px}.search{display:flex;gap:10px;background:var(--card);padding:10px;border:1px solid var(--border);border-radius:14px}.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;padding:12px;font-size:15px}.btn,.download{border:0;background:var(--red);color:white;font-weight:700;border-radius:10px;padding:12px 22px;cursor:pointer}.btn:disabled,.download:disabled{opacity:.55;cursor:wait}.status{display:none;text-align:left;margin-top:18px;padding:14px;border:1px solid var(--border);background:var(--card);border-radius:12px;font-size:14px}.status.show{display:block}.status.error{border-color:var(--red)}.status.success{border-color:var(--green)}.result{display:none;text-align:left;margin-top:24px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}.result.show{display:block}.preview{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}.media{width:190px;height:190px;background:#000;border-radius:10px;overflow:hidden}.media img,.media video{width:100%;height:100%;object-fit:contain}.info{flex:1;min-width:180px}.muted{color:var(--muted);font-size:13px}.qualities{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:18px}.quality{padding:13px;background:var(--card2);border:1px solid var(--border);border-radius:10px;cursor:pointer}.quality.selected{border-color:var(--red);background:#35151e}.download{width:100%;margin-top:16px;padding:14px}footer{text-align:center;padding:20px;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}@media(max-width:560px){main{padding-top:35px}.search{flex-direction:column}.btn{width:100%}.media{width:100%;height:auto;aspect-ratio:1}}
</style>
</head>
<body><header class="logo">📌 Pin<span>Grab</span></header>
<main><section class="hero"><h1>Descarga <span>videos e imágenes</span> de Pinterest</h1><p>Pega el enlace, selecciona el archivo y descárgalo.</p>
<div class="search"><input id="url" placeholder="https://pin.it/... o https://www.pinterest.com/pin/..." autocomplete="url"><button class="btn" id="search">🔍 Buscar</button></div>
<div class="status" id="status" role="status"></div>
<div class="result" id="result"><div class="preview"><div class="media" id="media"></div><div class="info"><strong id="title"></strong><p class="muted" id="description"></p><p class="muted" id="kind"></p></div></div><h4>Selecciona el archivo</h4><div class="qualities" id="qualities"></div><button class="download" id="download" disabled>⬇ Descargar</button></div>
</section></main><footer>© 2026 PinGrab · Descarga únicamente contenido que tengas derecho a utilizar.</footer>
<script>
const $=s=>document.querySelector(s);let pin=null,selected=null;
function status(message,type='info'){const el=$('#status');el.textContent=message;el.className=`status show ${type}`}
function validPinUrl(value){try{const u=new URL(value);const h=u.hostname.toLowerCase().replace(/^www\./,'');return u.protocol==='https:'&&(h==='pin.it'||h==='pinterest.com'||h.endsWith('.pinterest.com')||/^pinterest\.[a-z.]+$/.test(h))}catch{return false}}
function render(data){pin=data;selected=null;$('#title').textContent=data.title||'Pin de Pinterest';$('#description').textContent=data.description||'';$('#kind').textContent=data.type==='video'?'Video':'Imagen';const media=$('#media');media.replaceChildren();if(data.thumbnail){const img=document.createElement('img');img.src=data.thumbnail;img.alt='Vista previa';media.append(img)}else{media.textContent='Vista previa no disponible'}const list=$('#qualities');list.replaceChildren();data.qualities.forEach((q,i)=>{const item=document.createElement('button');item.type='button';item.className='quality';item.textContent=`${q.type==='video'?'🎬':'🖼️'} ${q.label} — ${q.description}`;item.addEventListener('click',()=>{selected=i;list.querySelectorAll('.quality').forEach(x=>x.classList.remove('selected'));item.classList.add('selected');$('#download').disabled=false});list.append(item)});$('#download').disabled=true;$('#result').classList.add('show')}
$('#search').addEventListener('click',async()=>{const url=$('#url').value.trim();if(!url)return status('Pega un enlace de Pinterest.','error');if(!validPinUrl(url))return status('El enlace no parece ser de Pinterest.','error');const btn=$('#search');btn.disabled=true;btn.textContent='Buscando…';$('#result').classList.remove('show');status('Consultando Pinterest…');try{const r=await fetch(`/api/pin?url=${encodeURIComponent(url)}`);const data=await r.json();if(!r.ok)throw new Error(data.error||'No se pudo obtener el pin.');render(data);status('Pin encontrado. Selecciona el archivo para descargar.','success')}catch(e){status(e.message,'error')}finally{btn.disabled=false;btn.textContent='🔍 Buscar'}});
$('#url').addEventListener('keydown',e=>{if(e.key==='Enter')$('#search').click()});
$('#download').addEventListener('click',()=>{if(selected===null||!pin)return;const q=pin.qualities[selected];const a=document.createElement('a');a.href=`/api/download?url=${encodeURIComponent(q.url)}`;a.download='';document.body.append(a);a.click();a.remove();status('La descarga se está preparando. Si el navegador pregunta, confirma la descarga.','success')});
</script></body></html>
